<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Reading Game</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reading Game">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
:root{
  --ground:#F3F0E6; --card:#FFFFFF; --ink:#23303F; --ink-soft:#66717F; --line:#D8D3C5;
  --accent:#E4572E; --sun:#F5C242; --leaf:#3E9B5F; --amber:#E0A13A; --sky:#CFE3F5;
  --name:#4C7DD1; --name-soft:#DCE8FA; --leaf-soft:#D8F0E0; --amber-soft:#FBE8D2;
  --shadow:0 6px 24px rgba(35,48,63,.10);
  --f-read:'Andika','Trebuchet MS','Verdana',sans-serif;
  --f-ui:'Fredoka','Andika','Trebuchet MS',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#171C22; --card:#232B35; --ink:#EEF1F4; --ink-soft:#A9B2BD; --line:#3B4552;
    --accent:#F07A55; --sun:#F5C242; --leaf:#5DBA7A; --amber:#E8B04C; --sky:#2B3D50;
    --name:#7AA3E6; --name-soft:#26364D; --leaf-soft:#22463A; --amber-soft:#47382A;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#171C22; --card:#232B35; --ink:#EEF1F4; --ink-soft:#A9B2BD; --line:#3B4552;
  --accent:#F07A55; --sun:#F5C242; --leaf:#5DBA7A; --amber:#E8B04C; --sky:#2B3D50;
  --name:#7AA3E6; --name-soft:#26364D; --leaf-soft:#22463A; --amber-soft:#47382A;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-read);font-size:18px;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--name);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
.strip{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:64px}
.iconbtn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.iconbtn svg{width:30px;height:30px}
.iconbtn.small{width:44px;height:44px}
.iconbtn.small svg{width:22px;height:22px}
.skyline{flex:1;height:44px;position:relative;border-radius:22px;background:var(--sky);overflow:hidden}
.skyline .kite{position:absolute;left:4%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;transition:left .5s ease}
.skyline .kite svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion: reduce){.skyline .kite{transition:none}.word .g{transition:none}.tile{transition:none}}

.home{flex:1;display:flex;flex-direction:column;padding:6px 18px 18px;gap:14px;min-height:0}
.brand{font-family:var(--f-ui);font-weight:600;font-size:30px;text-wrap:balance}
.brand small{display:block;font-family:var(--f-read);font-weight:400;font-size:15px;color:var(--ink-soft);margin-top:2px}
.levels{display:flex;gap:12px}
.lvl{flex:1;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:4px solid transparent;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px}
.lvl.on{border-color:var(--accent)}
.lvl .kites{display:flex;gap:2px}
.lvl .kites svg{width:30px;height:30px}
.lvl .lab{font-family:var(--f-ui);font-size:14px;color:var(--ink-soft)}
.lvl.on .lab{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1;min-height:0}
@media (max-width:700px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--card);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;border:4px solid transparent;min-height:140px}
.tile:active{transform:scale(.98)}
.tile .glyph{font-size:64px;line-height:1;display:flex;align-items:center;gap:10px}
.tile .glyph .w{font-family:var(--f-read);font-size:40px;font-weight:700;color:var(--accent)}
.tile .glyph .arrow{font-size:28px;color:var(--ink-soft)}
.tile .label{font-family:var(--f-ui);font-size:19px;color:var(--ink)}
.tile.locked{opacity:.45}
.homefoot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.gate{width:56px;height:56px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;position:relative;overflow:hidden}
.gate svg{width:26px;height:26px;position:relative}
.gate .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--sky)}
.done-note{font-size:15px;color:var(--ink-soft)}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 18px 18px;min-height:0;gap:16px}
.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);width:100%;max-width:760px;min-height:220px;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;border:6px solid transparent;transition:border-color .3s}
.card.ok{border-color:var(--leaf)}
.card.oops{border-color:var(--amber)}
.pic{font-size:min(28vw,150px);line-height:1}
.word{font-size:min(20vw,128px);line-height:1.15;display:flex;gap:.02em;justify-content:center;transition:gap .5s ease}
.word.split{gap:.5em}
.word .g{padding:0 .04em;border-radius:.12em;transition:background .2s;position:relative}
.word .g.lit{background:var(--sun)}
.word .g.silent{color:var(--ink-soft);opacity:.55}
.word.split .g:not(:last-child)::after{content:'';position:absolute;right:-.3em;top:55%;width:.12em;height:.12em;border-radius:50%;background:var(--ink-soft)}
.choices{display:flex;gap:16px;width:100%;max-width:820px;justify-content:center;flex-wrap:wrap}
.choice{flex:1;min-width:140px;max-width:260px;min-height:120px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:min(9vw,60px);border:5px solid transparent;transition:border-color .2s,opacity .2s,transform .1s}
.choice.pic{font-size:min(18vw,96px)}
.choice:active{transform:scale(.97)}
.choice.glow{border-color:var(--leaf);background:var(--leaf-soft)}
.choice.dim{opacity:.35}
.slots{display:flex;gap:10px;justify-content:center}
.slot{width:min(16vw,88px);height:min(16vw,88px);border-radius:16px;border:4px dashed var(--line);display:grid;place-items:center;font-size:min(10vw,58px);font-weight:700;background:rgba(0,0,0,.02)}
.slot.filled{border-style:solid;border-color:var(--name);background:var(--name-soft)}
.slot.lit{background:var(--sun);border-color:var(--sun)}
.tiles-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%;max-width:820px}
.tile-l{width:min(17vw,96px);height:min(17vw,96px);border-radius:18px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:min(10vw,58px);font-weight:700;border:4px solid transparent;transition:transform .12s,opacity .2s,border-color .2s}
.tile-l:active{transform:scale(.95)}
.tile-l.used{opacity:.25;pointer-events:none}
.tile-l.hint{border-color:var(--sun);animation:pulse 1s ease-in-out infinite}
.tile-l.shake{animation:shake .35s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bar{display:flex;justify-content:center;gap:22px;padding:12px 18px 22px;align-items:center}
.act{height:80px;min-width:150px;padding:0 30px;border-radius:40px;display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--f-ui);font-weight:600;font-size:22px;box-shadow:var(--shadow)}
.act svg{width:36px;height:36px}
.act.hear{background:var(--card);color:var(--ink)}
.act.next{background:var(--name);color:#fff;min-width:210px}
.act[disabled]{opacity:.35;pointer-events:none}

.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.center h1{font-family:var(--f-ui);font-weight:600;font-size:34px;margin:0;text-wrap:balance}
.center p{margin:0;color:var(--ink-soft);max-width:34em}
.bigkite{width:min(50vw,260px);height:min(50vw,260px)}
.bigkite svg{width:100%;height:100%}

.parent{flex:1;display:flex;flex-direction:column;min-height:0;-webkit-user-select:text;user-select:text}
.tabs{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto}
.tab{font-family:var(--f-ui);font-weight:600;font-size:16px;padding:10px 16px;border-radius:999px;background:var(--card);color:var(--ink-soft);white-space:nowrap}
.tab.on{background:var(--ink);color:var(--ground)}
.pane{display:none;flex:1;overflow:auto;padding:0 18px 28px;min-height:0}
.pane.on{display:block}
.pane h2{font-family:var(--f-ui);font-weight:600;font-size:22px;margin:18px 0 8px}
.pane h3{font-family:var(--f-ui);font-weight:600;font-size:15px;margin:16px 0 6px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.pane p,.pane li{font-size:16px;line-height:1.5;max-width:64ch}
.pane table{border-collapse:collapse;width:100%;max-width:720px;font-size:15px;font-variant-numeric:tabular-nums}
.pane th,.pane td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.pane th{font-family:var(--f-ui);font-weight:600;color:var(--ink-soft);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.pbtn{font-family:var(--f-ui);font-weight:600;font-size:16px;padding:12px 18px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);margin:4px 6px 4px 0;min-height:48px}
.pbtn.warn{background:var(--amber);color:#1B2A41}
.pbtn.on{outline:3px solid var(--name)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tipcard{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.tipcard b{font-family:var(--f-ui);display:block;margin-bottom:4px}
.field{display:flex;align-items:center;gap:12px;margin:8px 0;flex-wrap:wrap}
.note{font-size:15px;color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:14px;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
<section class="screen on" id="s-home">
  <div class="home">
    <div class="brand">Reading Game<small>Pictures and words</small></div>
    <div class="levels" id="levels"></div>
    <div class="tiles" id="tiles"></div>
    <div class="homefoot"><span class="done-note" id="home-note"></span><button class="gate" id="gate" aria-label="Grown-ups: hold for three seconds"><span class="fill"></span><span data-icon="lock"></span></button></div>
  </div>
</section>
<section class="screen" id="s-play">
  <div class="strip"><button class="iconbtn" id="btn-home" aria-label="Home"><span data-icon="home"></span></button><div class="skyline"><div class="kite" id="kite"><span data-icon="kite"></span></div></div><span style="width:56px"></span></div>
  <div class="stage" id="stage"></div>
  <div class="bar" id="bar"></div>
</section>
<section class="screen" id="s-end">
  <div class="center"><div class="bigkite"><span data-icon="kite"></span></div><h1 id="end-title">The kite flew high.</h1><p id="end-text"></p>
    <div class="bar" style="padding-bottom:0"><button class="act hear" id="btn-end-home" aria-label="Home"><span data-icon="home"></span></button><button class="act next" id="btn-end-more" aria-label="Another round"><span data-icon="next"></span></button></div></div>
</section>
<section class="screen" id="s-alldone">
  <div class="center"><div class="bigkite"><span data-icon="kiteHigh"></span></div><h1>All done for today.</h1><p>Reading time is finished. Go read a real book with someone.</p><button class="act hear" id="btn-alldone-home" aria-label="Home"><span data-icon="home"></span></button></div>
</section>
<section class="screen" id="s-parent">
  <div class="parent">
    <div class="strip"><button class="iconbtn small" id="btn-parent-close" aria-label="Close"><span data-icon="close"></span></button><div class="brand" style="font-size:22px;flex:1">Grown-ups</div></div>
    <div class="tabs"><button class="tab on" data-pane="how">How to play</button><button class="tab" data-pane="progress">Progress</button><button class="tab" data-pane="settings">Settings</button></div>
    <div class="pane on" id="pane-how"></div><div class="pane" id="pane-progress"></div><div class="pane" id="pane-settings"></div>
  </div>
</section>
<div class="toast" id="toast"></div>
</div>

<script>
// ---------- State ----------
const KEY='cat-hat-map-v1';
const DEFAULT={v:1, level:0, settings:{voice:'',rate:0.85,limit:false}, miss:{}, sessions:[], todayKey:'', today:{rounds:0,ms:0,done:false}};
let S=load();
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); return Object.assign({},DEFAULT,o,{settings:Object.assign({},DEFAULT.settings,o.settings||{})}); } }catch(e){} return JSON.parse(JSON.stringify(DEFAULT)); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function rollDay(){ const k=todayKey(); if(S.todayKey!==k){ S.todayKey=k; S.today={rounds:0,ms:0,done:false}; save(); } }
function currentSession(){ rollDay(); let s=S.sessions[S.sessions.length-1]; if(!s||s.date!==S.todayKey){ s={date:S.todayKey,p2wN:0,p2wOk:0,w2pN:0,w2pOk:0,buildN:0,buildOk:0,minutes:0,level:S.level||0}; S.sessions.push(s); } return s; }

// ---------- Utilities ----------
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2200); }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); }
document.querySelectorAll('[data-icon]').forEach(el=>{ el.innerHTML=ICONS[el.dataset.icon]||''; });
const icon=n=>ICONS[n]||'';
function daysSince(d){ return Math.floor((Date.now()-new Date(d+'T12:00:00').getTime())/86400000); }

// ---------- Speech ----------
let voices=[];
function loadVoices(){ try{ voices=speechSynthesis.getVoices()||[]; }catch(e){ voices=[]; } }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickVoice(){ if(!voices.length) return null; if(S.settings.voice){ const v=voices.find(v=>v.name===S.settings.voice); if(v) return v; } const en=voices.filter(v=>/^en[-_]US/i.test(v.lang)); return en.find(v=>/Samantha|Ava|Allison|Nicky|Zoe|Enhanced|Premium/i.test(v.name))||en[0]||voices.find(v=>/^en/i.test(v.lang))||voices[0]; }
function speak(text){ return new Promise(res=>{ if(!('speechSynthesis' in window)||!text) return res(); let done=false; const fin=()=>{ if(!done){ done=true; res(); } }; try{ const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=S.settings.rate||0.85; const v=pickVoice(); if(v) u.voice=v; u.onend=fin; u.onerror=fin; speechSynthesis.cancel(); speechSynthesis.speak(u); setTimeout(fin,1500+text.length*120); }catch(e){ fin(); } }); }

// ---------- Word helpers ----------
const TWO={sh:1,ch:1,th:1,wh:1,ng:1,ck:1,ar:1,or:1,er:1,ir:1,ur:1,ee:1,oo:1,ai:1,oa:1,ay:1,ea:1,ou:1,ow:1,ey:1,qu:1};
function parseWord(w){ const u=[]; let m; if((m=w.match(/^([^aeiou]{1,3})([aeiou])([^aeiou])e$/))){ u.push(...parseWord(m[1])); u.push({t:m[2]}); u.push({t:m[3]}); u.push({t:'e',silent:true}); return u; } for(let i=0;i<w.length;){ const two=w.slice(i,i+2); if(TWO[two]){ u.push({t:two}); i+=2; } else { u.push({t:w[i]}); i++; } } return u; }
function wordHTML(w){ return `<div class="word">${parseWord(w).map((x,i)=>`<span class="g ${x.silent?'silent':''}" data-i="${i}">${x.t}</span>`).join('')}</div>`; }
async function showParts(container){ const word=container.querySelector('.word'); if(!word) return; const gs=[...word.querySelectorAll('.g')]; word.classList.add('split'); await wait(600); for(const g of gs){ if(g.classList.contains('silent')) continue; g.classList.add('lit'); await wait(380); g.classList.remove('lit'); } await wait(150); word.classList.remove('split'); await wait(500); }
function stageOf(w){
  const groups=(w.match(/[aeiouy]+/g)||[]).length;
  if(/^[aeiou][^aeiouwy]{1,2}$/.test(w)) return 0;
  if(/^[^aeiouy]{3}/.test(w)||w.length>=7) return 3;

  if(/(sh|ch|th|wh|ng|ck)/.test(w)||/^[^aeiouy]{2}[aeiou]/.test(w)||/[aeiou][^aeiouy]{2}$/.test(w)||w.length>=6||(groups>=2&&!/[^aeiou]e$/.test(w))) return 2;
  if(/[aeiou][^aeiou]e$/.test(w)||/(ar|or|er|ir|ur|ee|oo|oa|ai|ea|ey|ow|ou|oy|aw|ew|ie|ue|ui|ay)/.test(w)) return 1;
  return 0;
}
const REAL_SET=new Set(Object.values(REAL).flat().concat(PICS.map(p=>p[0])));
const nearCache={};
function nearWords(w){ if(nearCache[w]) return nearCache[w]; const out=[]; for(let i=0;i<w.length;i++) for(const ch of 'abcdefghijklmnopqrstuvwxyz'){ if(ch===w[i]) continue; const alt=w.slice(0,i)+ch+w.slice(i+1); if(REAL_SET.has(alt)) out.push(alt); } return nearCache[w]=out; }
const RUDE=new Set('queef queer jizz cum tit tits ass arse shit fuck cock dick cunt fag fap piss poop crap damn sex wank twat slut whore bitch nig spic kike chink gook turd fart butt boob boobs dong wang dyke homo tard pussy pube pubes anus anal bum suck prick scum dildo penis vagina'.split(' '));
const VOW='aeiou', CONS='bcdfghjklmnprstvwyz';
function mutate(w){
  const L=w.length; const ok=i=>{ const c=w[i]; if(c==='q'||(i>0&&w[i-1]==='q')) return false; const isV=VOW.includes(c);
    if(isV){ if(i>0&&VOW.includes(w[i-1])) return false; if(i<L-1&&VOW.includes(w[i+1])) return false; if(i===L-1&&c==='e') return false; return true; }
    if(i===0) return L>1&&VOW.includes(w[1]); if(i===L-1) return VOW.includes(w[L-2]); return VOW.includes(w[i-1])&&VOW.includes(w[i+1]); };
  const idxs=[...w].map((c,i)=>i).filter(ok); if(!idxs.length) return null; const FINALS='bdfgklmnprstz';
  for(let t=0;t<40;t++){ const i=pick(idxs); const c=w[i]; const pool=VOW.includes(c)?VOW:(i===L-1?FINALS:CONS); const r=pool[Math.floor(Math.random()*pool.length)]; if(r===c) continue; const alt=w.slice(0,i)+r+w.slice(i+1); if(alt===w||RUDE.has(alt)||PIC_EMOJI[alt]||/(.)\1\1/.test(alt)) continue; return alt; }
  return null;
}
function distractors(w,n,hard){
  const want=n-1; const out=new Set();
  if(hard){ shuffle(nearWords(w).filter(x=>!RUDE.has(x)&&!PIC_EMOJI[x])).slice(0,want).forEach(x=>out.add(x)); }
  let guard=0; while(out.size<want&&guard++<80){ const alt=mutate(w); if(alt) out.add(alt); }
  const m=w.match(/[aeiou]/); if(out.size<want&&m){ for(const v of shuffle(VOW.split(''))){ if(out.size>=want) break; const alt=w.slice(0,m.index)+v+w.slice(m.index+1); if(alt!==w&&!RUDE.has(alt)) out.add(alt); } }
  return shuffle([w,...out]);
}

// ---------- Levels and pools ----------
const LV_NAMES=['Easy','Medium','Hard'];
// Easy: first sounds only. Medium: whole three-letter short-vowel words. Hard: everything else.
function lvlStage(){ return [0,0,3][S.level||0]; }
const DIG=/^(sh|ch|th|wh|ph|wr|kn|qu)/;
const SOFT_WORDS=new Set(['gem','giraffe','cherry','cent','city','circle','gerbil','giant']);
const VOWEL_OK=new Set(['ant','egg','apple','octopus','umbrella','elephant','otter','ambulance','anchor','axe','avocado']);
const SAME_SOUND={c:['k','q'],k:['c','q'],g:['j'],j:['g'],s:['z','c'],z:['s']};
function firstSoundOk(w){ return !DIG.test(w)&&!SOFT_WORDS.has(w)&&w[0]!=='x'&&(!VOW.includes(w[0])||VOWEL_OK.has(w)); }
function pool(){ const lv=S.level||0; if(lv===0) return PICS.filter(([w])=>firstSoundOk(w)); let p=PICS.filter(([w])=>stageOf(w)<=lvlStage()); if(lv===1) p=p.filter(([w])=>w.length===3&&stageOf(w)===0); if(lv===2){ const h=p.filter(([w])=>stageOf(w)>=1); if(h.length>=24) p=h; } return p; }
function letterChoices(w,n){ const f=w[0]; const avoid=new Set([f].concat(SAME_SOUND[f]||[])); const cands=(VOW.includes(f)?VOW:'bcdfghjklmnprstvwyz').split('').filter(c=>!avoid.has(c)); return shuffle([f,...shuffle(cands).slice(0,n-1)]); }
function letterPictureChoices(it,n){ const f=it.w[0]; const avoid=new Set([f].concat(SAME_SOUND[f]||[])); const cands=shuffle(pool().filter(([w])=>!avoid.has(w[0]))); const seen=new Set(), out=[]; for(const [w,e] of cands){ if(seen.has(w[0])) continue; seen.add(w[0]); out.push({w,e}); if(out.length>=n-1) break; } return shuffle([{w:it.w,e:it.e},...out]); }
function buildRound(n){ const p=pool(); const missed=p.filter(([w])=>(S.miss[w]||0)>0); const rest=p.filter(([w])=>!(S.miss[w]>0)); const out=shuffle(missed).slice(0,Math.min(4,missed.length)).concat(shuffle(rest)); return shuffle(out.slice(0,n)).map(([w,e])=>({w,e})); }
function pictureChoices(it,n){
  const lv=S.level||0; const all=PICS.filter(([w])=>w!==it.w); let cands;
  if(lv<=1) cands=shuffle(all.filter(([w])=>w[0]!==it.w[0]));
  else { const same=shuffle(all.filter(([w])=>w[0]===it.w[0])); const rime=shuffle(all.filter(([w])=>w[0]!==it.w[0]&&w.slice(-2)===it.w.slice(-2))); cands=(lv===2?rime.concat(same):same.concat(rime)).concat(shuffle(all)); }
  const seen=new Set([it.w]); const out=[]; for(const c of cands){ if(seen.has(c[0])) continue; seen.add(c[0]); out.push({w:c[0],e:c[1]}); if(out.length>=n-1) break; }
  return shuffle([{w:it.w,e:it.e},...out]);
}
function extraLetters(w,k){ const have=new Set(w); const vs=shuffle(VOW.split('').filter(c=>!have.has(c))); const cs=shuffle('bcdfghjklmnprstvwz'.split('').filter(c=>!have.has(c))); return [vs[0]].concat(cs.slice(0,k-1)); }

// ---------- Home ----------
const ACTS=[
  {id:'p2w', label:'Picture to word', glyph:'<span>🐱</span><span class="arrow">&#8594;</span><span class="w">cat</span>'},

function renderHome(){
  rollDay(); const done=!!S.settings.limit&&S.today.done;
  $('levels').innerHTML=[0,1,2].map(i=>`<button class="lvl ${(S.level||0)===i?'on':''}" data-lv="${i}" aria-label="${LV_NAMES[i]}"><span class="kites">${icon('kite').repeat(i+1)}</span><span class="lab">${LV_NAMES[i]}</span></button>`).join('');
  document.querySelectorAll('.lvl').forEach(b=>b.addEventListener('click',()=>{ S.level=+b.dataset.lv; save(); renderHome(); }));
  $('tiles').innerHTML=ACTS.map(a=>`<button class="tile ${done?'locked':''}" data-act="${a.id}" aria-label="${a.label}"><span class="glyph">${a.glyph}</span><span class="label">${a.label}</span></button>`).join('');
  $('home-note').textContent=done?'Reading time is finished for today.':(S.today.rounds?`${S.today.rounds} round${S.today.rounds>1?'s':''} today`:'');
  document.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>{ if(S.settings.limit&&S.today.done){ show('s-alldone'); return; } start(t.dataset.act); }));
}
function pointerHold(el,ms,onDone,fillEl){ let t=null,start=0,raf=null; const stop=()=>{ clearTimeout(t); t=null; if(raf) cancelAnimationFrame(raf); if(fillEl) fillEl.style.height='0'; }; const tick=()=>{ if(!t) return; const p=Math.min(1,(Date.now()-start)/ms); if(fillEl) fillEl.style.height=(p*100)+'%'; raf=requestAnimationFrame(tick); }; el.addEventListener('pointerdown',e=>{ e.preventDefault(); start=Date.now(); t=setTimeout(()=>{ stop(); onDone(); },ms); tick(); }); ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop)); }
pointerHold($('gate'),3000,()=>openParent(),$('gate').querySelector('.fill'));

// ---------- Play ----------
const P={act:null,queue:[],i:0,ok:0,tries:0,busy:false,enter:0,cur:null,pos:0,wrongHere:0};
const ROUND_N=12;
function setKite(f){ $('kite').style.left=(4+92*Math.max(0,Math.min(1,f)))+'%'; }
function leavePlay(){ if(P.enter){ const ms=Date.now()-P.enter; S.today.ms+=ms; const s=currentSession(); s.minutes=(s.minutes||0)+ms/60000; P.enter=0; } save(); }
$('btn-home').addEventListener('click',()=>{ leavePlay(); renderHome(); show('s-home'); });
function start(act){ rollDay(); P.act=act; P.i=0; P.ok=0; P.busy=false; P.enter=Date.now(); P.queue=buildRound(ROUND_N); show('s-play'); setKite(0); $('bar').innerHTML=''; next(); }
function next(){
  if(P.i>=P.queue.length) return endRound();
  P.cur=P.queue[P.i]; P.tries=0; P.busy=false; P.pos=0; P.wrongHere=0; setKite(P.i/P.queue.length); const it=P.cur, lv=S.level||0;
  P.answer=it.w; P.need=it.w.length;
  if(lv===0){
    if(P.act==='p2w'){ P.answer=it.w[0]; const opts=letterChoices(it.w,3); $('stage').innerHTML=`<div class="card"><div class="pic">${it.e}</div></div><div class="choices">${opts.map(o=>`<button class="choice" data-w="${o}" style="font-size:min(16vw,84px);font-weight:700">${o}</button>`).join('')}</div>`; document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>onChoice(b,b.dataset.w===P.answer))); return; }
    if(P.act==='w2p'){ const opts=letterPictureChoices(it,3); $('stage').innerHTML=`<div class="card"><div class="word" style="font-weight:700">${it.w[0]}</div></div><div class="choices">${opts.map(o=>`<button class="choice pic" data-w="${o.w}" aria-label="${o.w}">${o.e}</button>`).join('')}</div>`; document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>onChoice(b,b.dataset.w===it.w))); return; }
    if(P.act==='build'){ P.need=1; const letters=[...it.w]; const tiles=letterChoices(it.w,3); $('stage').innerHTML=`<div class="card" style="flex-direction:column;gap:18px"><div class="pic" style="font-size:min(20vw,110px)">${it.e}</div><div class="slots">${letters.map((l,i)=>i===0?'<div class="slot"></div>':`<div class="slot filled" style="border-color:var(--line);background:transparent">${l}</div>`).join('')}</div></div><div class="tiles-row">${tiles.map((t,i)=>`<button class="tile-l" data-i="${i}" data-l="${t}">${t}</button>`).join('')}</div>`; document.querySelectorAll('.tile-l').forEach(b=>b.addEventListener('click',()=>onTile(b))); return; }
  }
  if(P.act==='p2w'){ const opts=distractors(it.w, lv===2?4:3, lv>=2); $('stage').innerHTML=`<div class="card"><div class="pic">${it.e}</div></div><div class="choices">${opts.map(o=>`<button class="choice" data-w="${o}">${o}</button>`).join('')}</div>`; document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>onChoice(b,b.dataset.w===it.w))); }
  if(P.act==='w2p'){ const opts=pictureChoices(it, lv===2?4:3); $('stage').innerHTML=`<div class="card">${wordHTML(it.w)}</div><div class="choices">${opts.map(o=>`<button class="choice pic" data-w="${o.w}" aria-label="${o.w}">${o.e}</button>`).join('')}</div>`; document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>onChoice(b,b.dataset.w===it.w))); }
  if(P.act==='build'){ const letters=[...it.w]; const tiles=shuffle(letters.concat(extraLetters(it.w, lv===1?2:3))); $('stage').innerHTML=`<div class="card" style="flex-direction:column;gap:18px"><div class="pic" style="font-size:min(20vw,110px)">${it.e}</div><div class="slots">${letters.map(()=>'<div class="slot"></div>').join('')}</div></div><div class="tiles-row">${tiles.map((t,i)=>`<button class="tile-l" data-i="${i}" data-l="${t}">${t}</button>`).join('')}</div>`; document.querySelectorAll('.tile-l').forEach(b=>b.addEventListener('click',()=>onTile(b))); }
}
async function onChoice(b,right){
  if(P.busy) return; const it=P.cur; const s=currentSession(); const k=P.act; const card=$('stage').querySelector('.card');
  if(!right&&P.tries===0){ P.tries=1; s[k+'N']++; S.miss[it.w]=(S.miss[it.w]||0)+1; b.classList.add('dim'); card.classList.add('oops'); await wait(350); return; }
  P.busy=true; if(P.tries===0){ s[k+'N']++; s[k+'Ok']++; P.ok++; if(S.miss[it.w]>0) S.miss[it.w]--; }
  const key=(k==='p2w'&&(S.level||0)===0)?it.w[0]:it.w;
  const correct=document.querySelector(`.choice[data-w="${key}"]`); document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('dim',x!==correct)); correct.classList.add('glow'); card.classList.remove('oops'); card.classList.add(right?'ok':'oops');
  if(right){ await speak(it.w); await wait(600); }
  else if((S.level||0)===0){ await wait(600); await speak(it.w); await wait(2000); }
  else { if(k==='p2w'){ correct.innerHTML=wordHTML(it.w).replace('class="word"','class="word" style="font-size:inherit"'); await wait(500); await showParts(correct); } else { await showParts(card); } await speak(it.w); await wait(2000); }
  P.i++; save(); next();
}
async function onTile(b){
  if(P.busy) return; const it=P.cur; const want=it.w[P.pos]; const slots=[...document.querySelectorAll('.slot')];
  if(b.dataset.l===want){ b.classList.add('used'); b.classList.remove('hint'); slots[P.pos].textContent=want; slots[P.pos].classList.add('filled'); P.pos++; P.wrongHere=0; document.querySelectorAll('.tile-l.hint').forEach(x=>x.classList.remove('hint'));
    if(P.pos>=P.need){ P.busy=true; const s=currentSession(); s.buildN++; if(P.tries===0){ s.buildOk++; P.ok++; if(S.miss[it.w]>0) S.miss[it.w]--; } $('stage').querySelector('.card').classList.add('ok'); for(const sl of slots){ sl.classList.add('lit'); await wait(300); sl.classList.remove('lit'); } await speak(it.w); await wait(900); P.i++; save(); next(); } }
  else { P.tries++; P.wrongHere++; S.miss[it.w]=(S.miss[it.w]||0)+(P.wrongHere===1?1:0); b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),400); if(P.wrongHere>=2){ const t=[...document.querySelectorAll('.tile-l')].find(x=>!x.classList.contains('used')&&x.dataset.l===want); if(t) t.classList.add('hint'); } }
}
function endRound(){
  leavePlay(); S.today.rounds++; save();
  const over=!!S.settings.limit&&(S.today.rounds>=5||S.today.ms>=20*60*1000); if(over){ S.today.done=true; save(); }
  $('end-title').textContent=over?'The kite flew all the way up.':'The kite flew high.'; $('end-text').textContent=over?'Reading time is finished for today.':''; $('btn-end-more').hidden=over; show('s-end');
}
$('btn-end-home').addEventListener('click',()=>{ renderHome(); show(S.settings.limit&&S.today.done?'s-alldone':'s-home'); });
$('btn-end-more').addEventListener('click',()=>{ renderHome(); show('s-home'); });
$('btn-alldone-home').addEventListener('click',()=>{ renderHome(); show('s-home'); });

// ---------- Parent ----------
function openParent(){ show('s-parent'); renderHow(); renderProgress(); renderSettings(); }
$('btn-parent-close').addEventListener('click',()=>{ renderHome(); show('s-home'); });
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t)); document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+t.dataset.pane)); }));
function renderHow(){
  $('pane-how').innerHTML=`<h2>How to play</h2><div class="grid2">
  <div class="tipcard"><b>Easy is first sounds</b>At Easy the child only finds the sound a word starts with. Picture to word shows a picture and three letters: tap the letter it starts with. Word to picture shows one letter and three pictures: tap the picture that starts with it. Build the word shows the word with its first letter missing: tap the right tile. Words that start with sh, ch, th, wh, soft c or g, or a long vowel are left out so the first letter always says its usual sound.</div>
  <div class="tipcard"><b>Picture to word (Medium and Hard)</b>A picture with three words (four at Hard) that differ by one letter, such as cat, cot, cut. The single-letter difference means every letter has to be read, not just the first one.</div>
  <div class="tipcard"><b>Word to picture (Medium and Hard)</b>A word with three pictures. At Medium the pictures start with different letters. At Hard they share a first letter or an ending, so the child cannot pick from the first letter alone.</div>
  <div class="tipcard"><b>Build the word (Medium and Hard)</b>A picture and empty boxes. The child taps letter tiles in order to spell the whole word; a wrong tile shakes and after two misses the right one pulses. Spelling from sounds is the strongest practice of the three.</div>
  <div class="tipcard"><b>Levels</b>Easy is first sounds only. Medium is whole three-letter short-vowel words. Hard adds silent e, vowel teams, digraphs, blends, and longer words, with four choices.</div>
  <div class="tipcard"><b>What the voice does</b>After an answer the iPad says the word. It never says letter names, which get in the way of hearing sounds. Wrong answers show the word split into its parts with each lit in turn, then a pause.</div>
  <div class="tipcard"><b>Keep it short</b>Rounds are 12 cards. The daily limit is off by default; turn it on in Settings to stop play after five rounds or twenty minutes. Missed words come back first in the next round. Read real picture books together every day; this app only covers decoding.</div>
  </div>`;
}
function renderProgress(){
  const week=S.sessions.filter(s=>daysSince(s.date)<7); const mins=Math.round(week.reduce((a,s)=>a+(s.minutes||0),0));
  const pct=(o,n)=>n?Math.round(100*o/n)+'% of '+n:'-';
  const missed=Object.entries(S.miss).filter(([w,n])=>n>0).sort((a,b)=>b[1]-a[1]).slice(0,20);
  $('pane-progress').innerHTML=`<h2>Progress</h2><p>${mins} minute${mins===1?'':'s'} in the last seven days across ${week.length} day${week.length===1?'':'s'}.</p>
  <h3>Sessions (first-try accuracy)</h3>${S.sessions.length?`<table><tr><th>Date</th><th>Picture to word</th><th>Word to picture</th><th>Build</th><th>Level</th></tr>${S.sessions.slice(-10).reverse().map(s=>`<tr><td>${s.date}</td><td>${pct(s.p2wOk,s.p2wN)}</td><td>${pct(s.w2pOk,s.w2pN)}</td><td>${pct(s.buildOk,s.buildN)}</td><td>${LV_NAMES[s.level||0]}</td></tr>`).join('')}</table>`:'<p class="note">No sessions yet.</p>'}
  <h3>Words still being missed</h3><p>${missed.length?missed.map(([w,n])=>`${w} (${n})`).join(', '):'<span class="note">None right now.</span>'}</p>
  <p><button class="pbtn" id="btn-export">Copy all data</button></p>`;
  $('btn-export').addEventListener('click',async()=>{ const txt=JSON.stringify(S,null,1); try{ await navigator.clipboard.writeText(txt); toast('Copied.'); }catch(e){ toast('Could not copy.'); } });
}
function renderSettings(){
  loadVoices(); const en=voices.filter(v=>/^en/i.test(v.lang));
  $('pane-settings').innerHTML=`<h2>Settings</h2>
  <div class="field"><label>Voice</label><select id="set-voice" style="font:inherit;font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%"><option value="">Automatic</option>${en.map(v=>`<option value="${v.name}" ${S.settings.voice===v.name?'selected':''}>${v.name} (${v.lang})</option>`).join('')}</select><button class="pbtn" id="set-test">Test: cat, hat, map</button></div>
  <div class="field"><label>Speed</label><input type="range" id="set-rate" min="0.6" max="1.1" step="0.05" value="${S.settings.rate}"><span class="note" id="set-rate-v">${S.settings.rate}</span></div>
  <div class="field"><label>Daily limit</label><button class="pbtn ${S.settings.limit?'on':''}" id="set-limit">${S.settings.limit?'On: five rounds or 20 minutes':'Off'}</button><span class="note">When on, play stops for the day after five rounds or twenty minutes.</span></div>
  <div class="field"><button class="pbtn" id="set-more">Allow one more round today</button><span class="note">${S.settings.limit&&S.today.done?'Today is marked finished.':'Today is not finished.'}</span></div>
  <h3>On the iPad</h3><p>Open this page in Safari, tap Share, then "Add to Home Screen." Progress stays on the device.</p>
  <h3>Data</h3><div class="field"><button class="pbtn warn" id="set-reset">Hold to erase everything</button></div>`;
  $('set-voice').addEventListener('change',e=>{ S.settings.voice=e.target.value; save(); });
  $('set-test').addEventListener('click',async()=>{ await speak('cat'); await wait(300); await speak('hat'); await wait(300); await speak('map'); });
  $('set-rate').addEventListener('input',e=>{ S.settings.rate=+e.target.value; $('set-rate-v').textContent=S.settings.rate; save(); });
  $('set-limit').addEventListener('click',()=>{ S.settings.limit=!S.settings.limit; if(!S.settings.limit) S.today.done=false; save(); renderSettings(); });
  $('set-more').addEventListener('click',()=>{ rollDay(); S.today.done=false; S.today.rounds=Math.min(S.today.rounds,4); S.today.ms=Math.min(S.today.ms,16*60*1000); save(); toast('One more round allowed.'); renderSettings(); });
  pointerHold($('set-reset'),3000,()=>{ localStorage.removeItem(KEY); S=JSON.parse(JSON.stringify(DEFAULT)); save(); toast('Erased.'); openParent(); });
}
rollDay(); renderHome(); show('s-home');
</script>
